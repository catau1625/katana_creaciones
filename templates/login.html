{% extends 'base.html' %}
{% block title %}Ingresar — Katana Creaciones Web{% endblock %}
{% block content %}
<section class="seccion formulario-seccion">
    <h1>Iniciar sesión</h1>
    <form method="post" class="formulario">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-principal">Ingresar</button>
    </form>
    <p>¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a></p>
</section>
{% endblock %}
