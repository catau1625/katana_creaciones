{% extends 'base.html' %}
{% block title %}Ingresar — Katana Creaciones Web{% endblock %}
{% block content %}
<section class="login-envoltura">
    <div class="login-tarjeta">
        <h1>⚔️ Iniciar sesión</h1>
        <p class="login-sub">Accede a tu cuenta de Katana Creaciones Web</p>
        <form method="post" class="formulario">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-principal">Ingresar</button>
        </form>
        <p class="login-extra">¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a></p>
    </div>
</section>
{% endblock %}
