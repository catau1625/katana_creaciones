{% extends 'base.html' %}
{% block title %}{{ titulo }} — Panel{% endblock %}
{% block content %}
<section class="seccion formulario-seccion">
    <h1>{{ titulo }}</h1>
    <form method="post" enctype="multipart/form-data" class="formulario">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-principal">Guardar</button>
        <a class="btn-secundario" href="{% url 'panel_admin' %}">Volver</a>
    </form>
</section>
{% endblock %}
