{% extends 'base.html' %}
{% block title %}Registro — Katana Creaciones Web{% endblock %}
{% block content %}
<style>
.login-envoltura {
    min-height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.2rem;
}
.login-tarjeta {
    width: 100%;
    max-width: 470px;
    background: linear-gradient(160deg, var(--card-2), var(--card));
    border: 1px solid var(--card-borde);
    border-radius: var(--radio);
    box-shadow: var(--sombra);
    padding: 2.6rem 2.4rem;
}
.login-tarjeta h1 {
    font-size: 1.6rem;
    margin-bottom: .3rem;
}
.login-tarjeta .login-sub {
    color: var(--texto-suave);
    font-size: .9rem;
    margin-bottom: 1.8rem;
}
.login-tarjeta .formulario {
    margin-bottom: 1.4rem;
}
.login-tarjeta .btn-principal {
    width: 100%;
    text-align: center;
    padding: .9rem 1.2rem;
    font-size: 1rem;
    margin-top: .4rem;
}
.login-extra {
    text-align: center;
    font-size: .9rem;
    color: var(--texto-suave);
    border-top: 1px solid var(--card-borde);
    padding-top: 1.3rem;
}
.login-extra a { color: var(--cyan); font-weight: 600; }
.login-extra a:hover { color: #82E6C7; }
</style>

<section class="login-envoltura">
    <div class="login-tarjeta">
        <h1>⚔️ Crear cuenta</h1>
        <p class="login-sub">Regístrate para cotizar y dar seguimiento a tus proyectos</p>
        <form method="post" class="formulario">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-principal">Registrarse</button>
        </form>
        <p class="login-extra">¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
    </div>
</section>
{% endblock %}
