{% extends 'base.html' %}
{% block title %}Contacto — Katana Creaciones Web{% endblock %}
{% block content %}
<section class="seccion formulario-seccion">
    <h1>Contacto</h1>
    <p>Escríbenos a <strong>contacto@katanacreacionesweb.cl</strong> o usa el formulario:</p>
    <form method="post" enctype="multipart/form-data" class="formulario">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-principal">Enviar mensaje</button>
    </form>
</section>
{% endblock %}
