{% extends "admin/base_site.html" %}

{% block title %}⚔️ Katana Admin — {{ title }}{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
/* Tema oscuro esmeralda+naranja para Django Admin — estilo actual de katanacreacionesweb.cl */
:root {
    --primary: #34D399;
    --secondary: #2FA97F;
    --accent: #F69D41;
    --primary-fg: #0F0F18;

    --body-fg: #F1EFFA;
    --body-bg: #0F0F18;
    --body-quiet-color: #9C96BD;
    --body-loud-color: #F1EFFA;

    --header-color: #F1EFFA;
    --header-branding-color: #FFFFFF;
    --header-bg: linear-gradient(135deg, #0A2E1E, #0F0F18);
    --header-link-color: #A7F3D0;

    --breadcrumbs-fg: #82E6C7;
    --breadcrumbs-link-fg: #F1EFFA;
    --breadcrumbs-bg: #14251E;

    --link-fg: #5BD1AC;
    --link-hover-color: #82E6C7;
    --link-selected-fg: #FFFFFF;

    --hairline-color: rgba(91, 209, 172, .18);
    --border-color: rgba(91, 209, 172, .22);

    --error-fg: #FCA5A5;
    --message-success-bg: rgba(52, 211, 153, .16);
    --message-warning-bg: rgba(246, 157, 65, .16);
    --message-error-bg: rgba(232, 96, 90, .16);

    --darkened-bg: #13131E;
    --selected-bg: rgba(52, 211, 153, .28);
    --selected-row: rgba(52, 211, 153, .16);

    --button-fg: #0F0F18;
    --button-bg: #34D399;
    --button-hover-bg: #5BD1AC;
    --default-button-bg: #2FA97F;
    --default-button-hover-bg: #34D399;
    --close-button-bg: #1B1B28;
    --close-button-hover-bg: #2A2A3C;

    --delete-button-bg: #E23671;
    --delete-button-hover-bg: #B91E57;

    --object-tools-fg: #0F0F18;
    --object-tools-bg: #F69D41;
    --object-tools-hover-bg: #F7A040;

    --font-family-primary: 'Inter', 'Segoe UI', system-ui, sans-serif;
    --font-family-monospace: ui-monospace, 'SF Mono', Menlo, monospace;
}

/* Forzar modo oscuro incluso si el SO está en modo claro */
@media (prefers-color-scheme: light) {
    :root {
        --body-fg: #F1EFFA;
        --body-bg: #0F0F18;
        --darkened-bg: #13131E;
    }
}

html, body { background: #0F0F18; }

#header {
    background: linear-gradient(135deg, #0A2E1E, #0F0F18);
    color: #FFFFFF;
}
#branding h1 { font-weight: 800; letter-spacing: -.02em; }
#user-tools a { color: #A7F3D0; }

.module h2, .module caption, .inline-group h2 {
    background: #14251E;
    color: #82E6C7;
}
.module, .inline-group {
    border: 1px solid rgba(91, 209, 172, .22);
    border-radius: 10px;
    overflow: hidden;
}
#changelist .results thead th { background: #13131E; }

input, textarea, select, .form-row .vTextField {
    background: #1B1B28 !important;
    color: #F1EFFA !important;
    border: 1px solid rgba(91, 209, 172, .3) !important;
    border-radius: 8px;
}
input:focus, textarea:focus, select:focus {
    border-color: #34D399 !important;
    box-shadow: 0 0 0 3px rgba(52, 211, 153, .22) !important;
    outline: none;
}

.button, input[type=submit], input[type=button], .submit-row input, a.button {
    background: #34D399;
    color: #0F0F18;
    border-radius: 8px;
    font-weight: 600;
}
.button:hover, input[type=submit]:hover, input[type=button]:hover, a.button:hover {
    background: #5BD1AC;
}
.button.default, input[type=submit].default, .submit-row input.default {
    background: #2FA97F;
    border: none;
}
.button.default:hover, input[type=submit].default:hover {
    background: #34D399;
}

.selector select { background: #1B1B28; color: #F1EFFA; }
div.breadcrumbs { border-radius: 0; }
.login #container { border: 1px solid rgba(91,209,172,.25); border-radius: 14px; background: #1B1B28; }
.login #container .form-row label { color: #F1EFFA; }
</style>
{% endblock %}

{% block branding %}
<h1 id="site-name">⚔️ Katana Creaciones Web</h1>
{% endblock %}
